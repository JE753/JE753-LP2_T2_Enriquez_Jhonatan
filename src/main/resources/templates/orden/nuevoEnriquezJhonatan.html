<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva orden de compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4" style="max-width: 640px;">
    <h2 class="mb-4">Nueva orden de compra</h2>
    <form th:action="@{/orden/guardar}" th:object="${orden}" method="post">
        <div class="mb-3">
            <label for="proveedor" class="form-label">Proveedor</label>
            <select id="proveedor" class="form-select" th:field="*{proveedor.idProveedor}" required>
                <option value="">-- Seleccione un proveedor --</option>
                <option th:each="p : ${proveedores}" th:value="${p.idProveedor}"
                        th:text="${p.ruc + ' - ' + p.razonSocial}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="monto" class="form-label">Monto (S/.)</label>
            <input id="monto" type="number" step="0.01" min="0.01" class="form-control" th:field="*{monto}" required>
        </div>
        <div class="mb-3">
            <label for="direccionEntrega" class="form-label">Dirección de entrega</label>
            <input id="direccionEntrega" type="text" maxlength="255" class="form-control" th:field="*{direccionEntrega}" required>
        </div>
        <div class="mb-3">
            <label for="fechaEntrega" class="form-label">Fecha de entrega</label>
            <input id="fechaEntrega" type="date" class="form-control" th:field="*{fechaEntrega}" required>
        </div>
        <button type="submit" class="btn btn-success">Registrar</button>
        <a class="btn btn-secondary" th:href="@{/orden/listado}">Cancelar</a>
    </form>
</body>
</html>
