<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de órdenes de compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="container-fluid px-4 py-3">
    <div class="row align-items-center mb-3">
        <div class="col-md-5"><h1 class="mb-0">Listado de órdenes de compra</h1></div>
        <div class="col-md-4 text-center">
            <a class="btn btn-success px-4" th:href="@{/orden/nuevo}"><i class="bi bi-plus-lg"></i> Nuevo</a>
        </div>
    </div>
    <div th:if="${alert}" th:class="'alert alert-' + ${alert.tipo}" th:text="${alert.mensaje}"></div>
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark text-center">
            <tr>
                <th>Número</th><th>Fecha de entrega</th><th>Dirección de entrega</th><th>Proveedor</th>
                <th>Rubro</th><th>Página web</th><th>Monto</th><th>Estado</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="o : ${ordenes}">
                <td class="text-center" th:text="${o.nroOrden}"></td>
                <td class="text-center" th:text="${o.fechaEntrega}"></td>
                <td th:text="${o.direccionEntrega}"></td>
                <td th:text="${o.proveedor.ruc + ' - ' + o.proveedor.razonSocial}"></td>
                <td th:text="${o.proveedor.rubro.denominacion}"></td>
                <td th:text="${o.proveedor.paginaWeb}"></td>
                <td th:text="${'S/. ' + #numbers.formatDecimal(o.monto, 1, 'NONE', 2, 'POINT')}"></td>
                <td th:text="${o.estado == 'P' ? 'Pendiente' : (o.estado == 'C' ? 'Completado' : 'Anulado')}"></td>
                <td class="text-center">
                    <a class="btn btn-outline-secondary btn-sm" th:href="@{/orden/editar/{id}(id=${o.nroOrden})}">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
